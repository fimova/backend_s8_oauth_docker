server.port=8443
spring.application.name=web-bff

# Resilience4j - Circuit Breaker
# va en el bff porque aqui se debe proteger la llamada al microservicio
resilience4j.circuitbreaker.instances.transacciones.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transacciones.slidingWindowSize=5
resilience4j.circuitbreaker.instances.transacciones.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transacciones.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.transacciones.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.transacciones.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.transacciones.automaticTransitionFromOpenToHalfOpenEnabled=true